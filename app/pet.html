<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'"><title>妮可</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="pet.css"></head><body>
<div id="bubble" role="status" hidden></div>
<aside id="card" aria-label="妮可的对话气泡" hidden>
<header><div><h1>妮可 <span>在你身边</span></h1><p id="hunger">饱腹度 100%</p><progress id="hunger-bar" max="100" value="100"></progress></div><button id="feed" class="small">🍰 投喂</button><button id="close-card" class="small" aria-label="收起气泡">×</button></header>
<nav aria-label="功能"><button data-tab="status">状态</button><button data-tab="chat" class="active">聊天</button><button data-tab="screen">看屏幕</button><button data-tab="settings">设置</button></nav>
<main>
<section id="status" class="page" hidden><div class="satiety"><span>🍓</span><div><strong id="hunger-number">100%</strong><p id="hunger-description">吃饱啦，今天也元气满满！</p></div></div><p class="muted">每 5 分钟消耗 1% · 喂食恢复 30%</p></section>
<section id="chat" class="page"><div id="messages" role="log" aria-live="polite"><div class="welcome"><span>✦</span><h2>今天过得怎么样？</h2><p>开心的小事，或一点点烦恼，<br>都可以说给我听。</p></div></div><p id="thinking" hidden>妮可正在想…</p><form id="chat-form"><textarea id="message" maxlength="4000" rows="2" placeholder="和妮可说点什么…" aria-label="消息"></textarea><button id="send" class="primary" type="submit">发送 ↗</button></form><button id="clear" class="text-button">清空这次聊天</button></section>
<section id="screen" class="page" hidden><h2>让我看看你的世界</h2><p class="muted">点击才截图，预览后发送才会交给视觉模型。</p><label>选择显示器<select id="displays"></select></label><button id="capture" class="secondary">截一张预览</button><div id="screen-preview"><p>截图仅临时保存在内存中</p><img id="screenshot" alt="待发送的屏幕截图" hidden></div><p id="destination" class="muted"></p><div class="actions"><button id="analyze" class="primary" disabled>发送给视觉模型</button><button id="discard" class="secondary">丢弃</button></div></section>
<section id="settings" class="page" hidden><h2>模型与声音</h2><p class="muted">兼容 Chat Completions 接口，聊天与视觉可分别配置。</p><form id="settings-form">
<fieldset><legend>💬 聊天模型</legend><label>API 基础地址<input id="chat-base" type="url" placeholder="https://api.deepseek.com"></label><label>模型 ID<input id="chat-model" placeholder="deepseek-chat"></label><label>API Key<input id="chat-key" type="password" autocomplete="off" placeholder="未保存"></label><label class="check"><input id="chat-clear" type="checkbox">删除已保存的 Key</label></fieldset>
<fieldset><legend>👀 视觉模型</legend><label>API 基础地址<input id="vision-base" type="url" placeholder="https://ark.cn-beijing.volces.com/api/v3"></label><label>支持图片输入的模型 ID<input id="vision-model" placeholder="填写控制台中的视觉模型 ID"></label><label>API Key<input id="vision-key" type="password" autocomplete="off" placeholder="未保存"></label><label class="check"><input id="vision-clear" type="checkbox">删除已保存的 Key</label></fieldset>
<label class="check"><input id="voice" type="checkbox">使用本机中文语音朗读回复</label><p class="muted">Key 由系统加密保存，加密不可用时只保留到退出。聊天记录不落盘；清空模型 ID 可停用。</p><button class="primary" type="submit">保存设置</button></form></section>
</main><div id="notice" role="status" hidden></div></aside>
<button id="pet" title="单击聊天 · 双击状态 · 右键互动 · 拖动搬家" aria-label="妮可：单击聊天，双击饥饿度，右键互动"><canvas id="sprite" width="384" height="416"></canvas></button><script src="pet.js"></script><script src="panel.js"></script></body></html>
