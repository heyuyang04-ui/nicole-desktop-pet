name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64
            artifact: mac-arm64
          - os: macos-15-intel
            args: --mac --x64
            artifact: mac-x64
          - os: windows-latest
            args: --win --x64
            artifact: windows-x64
          - os: windows-latest
            args: --win --arm64
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: nicole-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
